name: Entertainment Data Updater

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-entertainment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run entertainment data aggregation script
        env:
          CF_ACCOUNT_ID: 6e28c300aba6774b4357794886a90d38
          CF_KV_ENTERTAINMENT_NAMESPACE_ID: ${{ secrets.CF_KV_ENTERTAINMENT_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node entertainment/fetch-entertainment.js
